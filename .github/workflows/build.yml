name: lint

# Static checks only. The SDK in this repository is frozen, so the code here is not compiled
# against it: newer loader code may need SDK parts that are not public. Release builds are made
# elsewhere.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cpp:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck
      - name: cppcheck
        # Headers outside this repository (game data, SDK additions, system headers) are not
        # needed: missing includes are ignored, and only real warnings fail the job.
        run: |
          cppcheck --version
          cppcheck --std=c++20 --language=c++ --enable=warning,portability \
            --inline-suppr --error-exitcode=1 --quiet --max-configs=4 \
            --suppress=missingInclude --suppress=missingIncludeSystem --suppress=unknownMacro \
            -j "$(nproc)" core launcher bootstrap

  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Byte-compile scripts
        run: python3 -m py_compile bootstrap/generate_exports.py

  shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck --severity=error linux/*.sh
